[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yp"
version = "0.3.7"
description = "Search YouTube and play audio-only from the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "yt-dlp",
    "questionary",
]

[project.scripts]
yp = "yp:main"

[tool.setuptools]
py-modules = ["yp", "searcher", "selector", "player", "related", "comments", "ytdlp_common"]

name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install yt-dlp questionary pytest build
      - name: Run tests
        run: python -m pytest tests/ -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Verify every module is packaged
        run: |
          set -e
          listing=$(tar tzf dist/*.tar.gz)
          for m in $(ls *.py | sed 's/\.py$//'); do
            echo "$listing" | grep -q "/${m}.py$" || { echo "sdist에 ${m}.py 누락"; exit 1; }
          done
          echo "모듈 전부 포함"
